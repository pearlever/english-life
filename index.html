{id:'figure out',cat:0,ko:'알아내다, 이해하다, 해결하다',star:2,freq:'매우 높음',tags:['Neutral','Daily'],pattern:'figure out + 명사 / 의문사절; figure it out (O), figure out it (X)',examples:[['일상','Don’t worry. We’ll figure something out.','걱정 마. 방법을 찾아낼 거야.'],['직장','We need to figure out why the numbers don’t add up.','수치가 왜 맞지 않는지 알아내야 해.'],['관계','I need time to figure out how I feel.','내 감정이 어떤지 알아볼 시간이 필요해.'],['기술','We’re figuring out how AI will affect jobs.','AI가 일자리에 미칠 영향을 파악하고 있어.']]},
{id:'bring up',cat:0,ko:'화제를 꺼내다, 언급하다',star:2,freq:'높음',tags:['Neutral','Conversation'],pattern:'bring up + 주제 / bring it up',examples:[['친구','I didn’t want to bring it up at dinner.','저녁 식사 때 그 얘기를 꺼내고 싶지 않았어.'],['직장','She brought up an important issue.','그녀가 중요한 문제를 제기했어.'],['관계','Can I bring up something personal?','개인적인 얘기 하나 꺼내도 될까?']]},
{id:'rule out',cat:0,ko:'가능성을 배제하다',star:3,freq:'보통',tags:['Neutral','Debate'],pattern:'rule out + 명사 / rule it out',examples:[['과학','We can’t rule out life on other planets.','다른 행성의 생명체 가능성을 배제할 수 없어.'],['직장','Let’s not rule out that option yet.','그 선택지는 아직 배제하지 말자.'],['건강','The doctor ruled out an infection.','의사가 감염 가능성을 배제했어.']]},
{id:'run into',cat:0,ko:'우연히 마주치다, 문제에 부딪히다',star:2,freq:'높음',tags:['Casual'],pattern:'run into + 사람 / 문제',examples:[['일상','I ran into an old friend yesterday.','어제 옛 친구를 우연히 만났어.'],['업무','We ran into a technical issue.','기술적인 문제에 부딪혔어.']]},

{id:'far-fetched',cat:1,ko:'믿기 어려운, 터무니없는',star:3,freq:'보통',tags:['Neutral','Opinion'],pattern:'a far-fetched idea / sound far-fetched',examples:[['토론','That theory sounds far-fetched.','그 이론은 믿기 어려워 보여.'],['일상','It may seem far-fetched, but hear me out.','황당하게 들리겠지만 끝까지 들어봐.']]},
{id:'compelling',cat:1,ko:'설득력 있는, 매력적인',star:3,freq:'보통',tags:['Neutral','Business'],pattern:'a compelling argument / story',examples:[['토론','She made a compelling argument.','그녀는 설득력 있는 주장을 했어.'],['문화','It’s a compelling story.','정말 몰입하게 만드는 이야기야.']]},
{id:'break the ice',cat:2,ko:'어색한 분위기를 풀다',star:2,freq:'높음',tags:['Casual'],pattern:'break the ice (with + 사람)',examples:[['모임','A quick game helped break the ice.','짧은 게임이 어색함을 풀어줬어.'],['직장','He told a joke to break the ice.','그는 분위기를 풀려고 농담했어.']]},
{id:'on the same page',cat:2,ko:'서로 이해·인식이 일치하는',star:3,freq:'높음',tags:['Neutral','Business'],pattern:'be on the same page (about + 주제)',examples:[['직장','Let’s make sure we’re on the same page.','우리 이해가 같은지 확인하자.'],['관계','I don’t think we’re on the same page.','우리 생각이 같지는 않은 것 같아.']]},
{id:'a double-edged sword',cat:2,ko:'양날의 검',star:4,freq:'보통',tags:['Neutral','Debate'],pattern:'be a double-edged sword',examples:[['기술','Social media is a double-edged sword.','소셜미디어는 양날의 검이야.'],['직장','Working remotely can be a double-edged sword.','원격근무에는 장단점이 있어.']]},
{id:'make a decision',cat:3,ko:'결정을 내리다',star:1,freq:'매우 높음',tags:['Neutral'],pattern:'make a decision about/on + 명사',examples:[['일상','I need to make a decision by Friday.','금요일까지 결정해야 해.'],['직장','We haven’t made a final decision.','아직 최종 결정을 내리지 않았어.']]},

{id:'I’m down',cat:4,ko:'나 좋아, 나도 할래',star:2,freq:'높음',tags:['Casual','Informal'],pattern:'I’m down (for + 명사 / to + 동사)',examples:[['친구','Pizza tonight? I’m down!','오늘 피자? 나 좋아!'],['약속','I’m down to try something new.','새로운 걸 해볼 생각 있어.']]},
{id:'my bad',cat:4,ko:'내 실수야, 미안',star:2,freq:'높음',tags:['Casual','Informal'],pattern:'My bad. (가벼운 사과)',examples:[['친구','Oops, my bad. I got the time wrong.','앗, 내 실수야. 시간을 착각했어.'],['일상','My bad! I thought you meant tomorrow.','미안! 내일 말하는 줄 알았어.']]},
{id:'The thing is',cat:5,ko:'문제는 말이야, 사실은',star:2,freq:'매우 높음',tags:['Neutral','Conversation'],pattern:'The thing is, + 완전한 문장',examples:[['일상','The thing is, I already have plans.','문제는 이미 약속이 있어.'],['직장','The thing is, we’re running out of time.','문제는 시간이 부족하다는 거야.']]},
{id:'I’d rather',cat:5,ko:'차라리 ~하고 싶다',star:2,freq:'높음',tags:['Neutral'],pattern:'I’d rather + 동사원형 (+ than + 동사원형)',examples:[['일상','I’d rather stay home tonight.','오늘 밤은 집에 있고 싶어.'],['직장','I’d rather discuss this in person.','이건 직접 만나 이야기하고 싶어.']]},
{id:'I see your point',cat:6,ko:'무슨 말인지 알겠어, 일리 있어',star:2,freq:'높음',tags:['Neutral','Discussion'],pattern:'I see your point, but + 반론',examples:[['토론','I see your point, but I disagree.','무슨 말인지는 알겠지만 동의하지 않아.'],['직장','I see your point. Let’s test both ideas.','일리 있어. 두 아이디어를 시험해 보자.']]},
{id:'Speaking of which',cat:6,ko:'말 나온 김에',star:3,freq:'보통',tags:['Neutral','Conversation'],pattern:'Speaking of which, + 새 주제',examples:[['친구','Speaking of which, how was your trip?','말 나온 김에, 여행은 어땠어?'],['직장','Speaking of which, did you get my email?','그 얘기가 나와서 말인데, 내 이메일 받았어?']]},

const normalizeExpression=v=>String(v||'').normalize('NFKC').trim().toLocaleLowerCase('en-US').replace(/[’‘]/g,"'").replace(/\s+/g,' ');
function libraryStatus(message){const el=document.getElementById('libraryAddStatus');if(el)el.textContent=message;else toast(message)}
async function geminiStructured(prompt,maxTokens=2300){
 if(!aiKey)throw Error('Settings에서 Gemini API 키를 먼저 연결해 줘.');
 const payload={contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.75,responseMimeType:'application/json',maxOutputTokens:maxTokens}};
 for(let attempt=0;attempt<2;attempt++){
  let response,data;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),45000);
  try{
   response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':aiKey},body:JSON.stringify(payload),signal:controller.signal});
   data=await response.json().catch(()=>({}));
  }catch(err){
   if(err.name==='AbortError')throw Error('AI 응답 시간이 초과됐어. 나중에 다시 시도해 줘.');
   throw Error('네트워크 오류: '+err.message);
  }finally{clearTimeout(timer)}
  if(response.ok){
   const raw=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
   try{return JSON.parse(raw)}catch{throw Error('AI 응답을 읽지 못했어. 다시 시도해 줘.')}
  }
  const message=String(data.error?.message||'HTTP '+response.status);
  if(response.status===429)throw Error('API 무료 사용량 제한(429). 시간이 지난 후 다시 시도해 줘.');
  const overloaded=response.status===503||/high demand|overloaded|temporarily unavailable/i.test(message);
  if(overloaded&&attempt===0){await new Promise(done=>setTimeout(done,1800));continue}
  if(overloaded)throw Error('Gemini 서버 혼잡: '+message);
  throw Error(message);
 }
}
function normalizeGeneratedExpression(entry,requestedId){
 if(!entry||typeof entry!=='object')return null;
 const id=String(requestedId||entry.id||'').trim().slice(0,100);
 if(!id||/[<>\\n\\r]/.test(id))return null;
 const cat=Number(entry.cat),star=Number(entry.star);
 const examples=(Array.isArray(entry.examples)?entry.examples:[]).filter(x=>Array.isArray(x)&&x.length>=3&&x.every(v=>typeof v==='string')).slice(0,4).map(x=>x.map(t=>t.slice(0,450)));
 if(!String(entry.ko||'').trim()||!examples.length)return null;
 return {id,cat:Number.isInteger(cat)&&cat>=0&&cat<cats.length?cat:1,ko:String(entry.ko).slice(0,170),star:Number.isInteger(star)&&star>=1&&star<=5?star:3,freq:['매우 높음','높음','보통','낮음'].includes(entry.freq)?entry.freq:'보통',tags:Array.isArray(entry.tags)?entry.tags.filter(x=>typeof x==='string').slice(0,4).map(x=>x.slice(0,40)).concat('AI'):['AI'],pattern:String(entry.pattern||'Natural context and grammar depend on the sentence.').slice(0,360),examples};
}
function addGeneratedExpression(entry){
 if(catalog.some(old=>normalizeExpression(old.id)===normalizeExpression(entry.id)))return false;
 catalog.unshift(entry);if(!Array.isArray(state.custom))state.custom=[];state.custom.unshift(entry);state.saved[entry.id]='new';return true;
}
async function randomAddExpressions(){
 if(!aiKey){libraryStatus('Settings에서 Gemini API 키를 연결해야 랜덤 표현을 생성할 수 있어.');return}
 const button=document.getElementById('randomAddBtn');
 if(button)button.disabled=true;
 libraryStatus('Gemini가 새 영어 표현 10개를 생성하는 중...');
 try{
  const excludes=catalog.map(e=>e.id);
  const prompt='Generate exactly 15 distinct, useful, natural English expressions for an adult Korean learner of spoken English. Do not include any item from this EXCLUSION LIST: '+JSON.stringify(excludes)+'. Include phrasal verbs, collocations, idioms, sentence patterns, slang and conversation skills. Output ONLY valid JSON in the shape {"expressions":[{"id":"expression in English","cat":0,"ko":"meaning and nuance in natural Korean","star":2,"freq":"높음","tags":["Neutral","Daily"],"pattern":"precise English grammar, register and usage","examples":[["일상","natural example English sentence","Korean translation"],["직장","a different natural English sentence","Korean translation"],["토론","another realistic sentence","Korean translation"]]}]}. Category codes: 0 Phrasal Verbs; 1 Vocabulary; 2 Idioms; 3 Collocations; 4 Slang & Informal; 5 Sentence Patterns; 6 Conversation Skills. star 1-5. freq: 매우 높음,높음,보통,낮음. All entries must have three realistic translated examples; no duplicates or unnatural invented expressions.';
  const data=await geminiStructured(prompt,7600);
  const seen=new Set(catalog.map(e=>normalizeExpression(e.id)));
  const items=[];
  for(const raw of (Array.isArray(data.expressions)?data.expressions:[])){
    const e=normalizeGeneratedExpression(raw);
    if(!e||e.examples.length<3||seen.has(normalizeExpression(e.id)))continue;
    seen.add(normalizeExpression(e.id));items.push(e);
    if(items.length===10)break;
  }

 }catch(err){libraryStatus('AI 생성 실패 · 저장된 표현 없음: '+String(err.message||err).slice(0,190))}

 앱 설치/홈 화면에 추가.</p><div class="row"><button class="btn" id="installPwaBtn" onclick="installEnglishLife()">앱 설치</button><button class="btn secondary" onclick="testEnglishNotification()">알림 권한 요청 및 테스트</button></div><p id="pwaStatus" class="notice" style="margin-top:10px">이 기능은 HTTPS 웹주소에서 작동해. 테스트 알림은 지금 버튼을 눌렀을 때만 전송되며, 매일 자동 푸시 발송은 아직 준비 중이야.</p><p class="notice">알림 권한을 허용하더라도 앱을 종료한 뒤 예약 푸시가 자동으로 전송되는 것은 아니야. 그것은 별도의 Push 구독 및 예약 발송 서버 설정이 필요해.</p></div><div class="card"><h2>백업 및 복원</h2><p class="notice">브라우저 데이터를 지우면 기록이 사라질 수 있어. JSON 파일로 백업해 줘.</p><div class="row"><button class="btn" onclick="exportData()">⬇ JSON 백업</button><label class="btn secondary" style="cursor:pointer">⬆ JSON 복원<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label></div></div><div class="card"><h2>✨ Gemini AI · 무료 사용량 연결</h2><p class="notice">Google AI Studio에서 발급한 API 키를 입력하면 상대방이 실제 답변 내용을 반영하고, Better Way to Say와 모범 답변을 제공해. Google의 무료 사용량·모델 제공 조건은 변경될 수 있어. 키는 현재 탭 세션에만 저장되고, Google API로 직접 전송돼. 개인 기기에서만 사용하고 공개/공유된 파일에 키를 넣지 마.</p><label class="small">Gemini API key</label><input id="geminiKey" type="password" class="field" autocomplete="off" placeholder="AIza..." value="${esc(aiKey)}"><div class="row" style="margin-top:10px"><button class="btn" onclick="saveAIKey()">AI 연결 설정</button><button class="btn secondary" onclick="clearAIKey()">연결 해제</button></div><label class="small" style="display:flex;align-items:center;gap:8px;margin-top:12px"><input id="rememberKey" type="checkbox" ${!!localStorage.getItem('englishLifeGeminiKeyRemembered')?'checked':''}> 이 기기에 API 키 기억하기 (개인 기기 전용)</label><p class="notice">체크하면 이 사이트의 브라우저 저장소에 키를 보관해. 같은 주소에서 재접속해도 다시 입력할 필요가 없지만, 공유 PC에서는 사용하지 마. 브라우저 저장소는 암호화된 비밀 금고가 아니야.</p><p class="small muted">키 발급: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a> · 모델: gemini-3.8-flash · 서버 혼잡 시 최대 2회 자동 재시도</p></div><div class="card"><h2>Engine status</h2><p class="notice">API 키를 연결하면 AI가 문맥에 따라 응답해. 키가 없으면 키워드 기반 데모 대화를 사용해. 음성 인식은 브라우저/운영체제에 따라 외부 서비스를 이용할 수 있어.</p><button class="btn ghost tiny" onclick="resetData()">모든 로컬 학습 데이터 초기화</button></div>`}

function saveAIKey(){const key=$('geminiKey')?.value.trim()||'';if(!key){toast('API 키를 입력해 줘.');return}aiKey=key;sessionStorage.setItem('englishLifeGeminiKey',key);if($('rememberKey')?.checked)localStorage.setItem('englishLifeGeminiKeyRemembered',key);else localStorage.removeItem('englishLifeGeminiKeyRemembered');toast('AI 연결 정보가 설정됐어. Play에서 실제 응답을 시험해 봐.');renderSettings()}
function clearAIKey(){aiKey='';sessionStorage.removeItem('englishLifeGeminiKey');localStorage.removeItem('englishLifeGeminiKeyRemembered');renderSettings();toast('AI 연결을 해제했어.')}
async function geminiReply(answer,previous,scenario){const context=`You are ${scenario.npc}, a believable conversational character in an English-learning roleplay. Scenario: ${scenario.context}. The scenario title is ${scenario.title}. Your initial position: ${scenario.opening}. You must RESPOND DIRECTLY to the student's most recent answer, refer to a specific claim or detail, and ask exactly one thoughtful follow-up question. Stay in character, conversational, natural, 35-90 words. Do not fabricate facts about the student. Separately act as a supportive English speaking coach. The student's optional expressions are ${scenario.targets.join(', ')}. Do not force them. Preserve intended meaning in improvements. Return only a valid JSON object with four string properties: reply (character response), feedback (brief specific Korean feedback on clarity/grammar/naturalness; avoid invented errors), better (natural improved version of student's response in English; keep main ideas), model (a high-quality independent English sample answer to the previous character turn, not a copy of the student's response). For long answers, keep better and model concise but substantive. Do not grade pronunciation or fluency from text.`;const messages=previous.map(m=>({role:m.role==='me'?'user':'model',parts:[{text:m.text}]}));messages.push({role:'user',parts:[{text:answer}]});
const payload={systemInstruction:{parts:[{text:context}]},contents:messages,generationConfig:{temperature:0.8,responseMimeType:'application/json',maxOutputTokens:2400}};
let response,data;
for(let attempt=0;attempt<3;attempt++){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),45000);
 try{
  response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':aiKey},body:JSON.stringify(payload),signal:controller.signal});
  data=await response.json().catch(()=>({}));
 }catch(e){if(e.name==='AbortError')throw Error('응답 시간 초과(45초). 작성한 답변은 유지했어. 다시 시도해 줘.');throw Error('네트워크 연결 실패: '+e.message)}
 finally{clearTimeout(timeout)}
 if(response.ok)break;
 const message=String(data.error?.message||'HTTP '+response.status);
 const overload=response.status===503||(/high demand|overloaded|temporarily unavailable/i.test(message));
 if(overload&&attempt<2){const delay=(attempt===0?1800:4200)+Math.floor(Math.random()*500);const b=$('sendBtn');if(b)b.textContent=`AI 서버 혼잡 · ${attempt+1}/2회 재시도 중...`;await new Promise(resolve=>setTimeout(resolve,delay));continue}
 if(response.status===429)throw Error('무료 사용량 또는 요청 속도 제한(429). 잠시 기다린 뒤 다시 시도해 줘. 자동 재시도하지 않았어.');
 if(overload)throw Error('Gemini 서버 혼잡(503). 2회 재시도했지만 실패했어. 잠시 뒤 다시 시도해 줘.');
 throw Error(message);
}
let raw=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');let parsed;try{parsed=JSON.parse(raw)}catch{throw Error('AI 응답 형식을 읽지 못했어. 다시 시도해 줘.')}if(!parsed.reply||typeof parsed.reply!=='string')throw Error('AI 대사가 비어 있어.');return {reply:String(parsed.reply),feedback:String(parsed.feedback||''),better:String(parsed.better||''),model:String(parsed.model||'')}}
function aiFeedbackHTML(r,txt,found){return `<div class="feedback"><strong>✨ AI Coach · 내 답변 분석</strong><p class="small">${esc(r.feedback)}</p><h3>Better Way to Say</h3><p>${esc(r.better)}</p><button class="btn tiny secondary" onclick="speak(this.dataset.text)" data-text="${esc(r.better)}">🔊 듣기</button><h3>AI Model Answer</h3><p>${esc(r.model)}</p><button class="btn tiny secondary" onclick="speak(this.dataset.text)" data-text="${esc(r.model)}">🔊 듣기</button><p class="small muted">${found.length?'목표 표현 발견: '+found.map(esc).join(', '):'목표 표현을 사용하지 않아도 괜찮아.'} · 자동 평가이므로 오류가 있을 수 있어.</p><button class="btn tiny secondary" onclick="retryTurn()">↻ 답변 다시 쓰기</button></div>`}

function showCoachSummary(){const el=$('summaryFeedback')||$('turnFeedback');if(!el)return;const reports=coachReports.length?coachReports:(state.sessions.at(-1)?.reports||[]);if(!reports.length){el.innerHTML='<p class="notice">아직 AI 분석 기록이 없어.</p>';return}const total=reports.reduce((a,r)=>a+(r.words||wordCount(r.answer)),0);el.innerHTML=`<div class="feedback"><h3>📊 Speaking Report</h3><p class="small">${reports.length} answers · ${total} words · 평균 ${Math.round(total/reports.length)} words / answer</p><p class="notice">단어 수는 텍스트 기준이야. 실제 발음·속도·CEFR 점수는 평가하지 않아.</p>${reports.map((r,i)=>`<details style="margin:12px 0;border-top:1px solid #557;padding-top:12px" ${i===reports.length-1?'open':''}><summary style="cursor:pointer;font-weight:700">Answer ${i+1} · ${r.words||wordCount(r.answer)} words ${r.retryOf?'· Retry':''}</summary><h3>My Answer</h3><p style="white-space:pre-wrap">${esc(r.answer)}</p>${r.retryOf?`<h3>First Attempt</h3><p style="white-space:pre-wrap">${esc(r.retryOf)}</p><p class="notice">두 답변을 나란히 확인해 봐. 단어 수 증감만으로 실력 향상을 판단하지 않아.</p>`:''}<h3>AI Feedback</h3><p>${esc(r.result.feedback)}</p><h3>Better Way to Say</h3><p>${esc(r.result.better)}</p><button class="btn tiny secondary" data-text="${esc(r.result.better)}" onclick="speak(this.dataset.text)">🔊 Listen</button><h3>Model Answer</h3><p>${esc(r.result.model)}</p><button class="btn tiny secondary" data-text="${esc(r.result.model)}" onclick="speak(this.dataset.text)">🔊 Listen</button></details>`).join('')}</div>`}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='english-life-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let parsed=JSON.parse(await file.text());if(!parsed.data||typeof parsed.data.saved!=='object'||!Array.isArray(parsed.data.sessions))throw Error('invalid');if(!confirm('현재 학습 데이터를 백업 파일로 덮어쓸까?'))return;state=Object.assign(structuredClone(initial),parsed.data);if(!state.settings)state.settings=structuredClone(initial.settings);persist();loadCustom();applyTheme();navs();go('home');toast('백업을 복원했어.')}catch{toast('올바른 English Life 백업 파일이 아니야.')}}function resetData(){if(confirm('정말 모든 로컬 학습 데이터를 삭제할까? 되돌릴 수 없어.')){state=structuredClone(initial);persist();location.reload()}}function loadCustom(){catalog.splice(0,catalog.length,...catalog.filter(e=>!e.tags.includes('Custom')));for(const e of state.custom||[])if(!catalog.some(x=>x.id===e.id))catalog.unshift(e)}const UI_EN={'오늘도 조금씩, 실제로 쓸 수 있는 영어를 늘려가자.':'Grow your real-world English, one day at a time.','오늘의 퀘스트 시작 →':'Start today’s quest →','표현 살펴보기':'Browse expressions','복습 시작':'Start review','학습 원칙':'Learning principle','상황을 선택하고 직접 영어로 대답해 봐.':'Choose a scenario and respond in English.','나가기':'Exit','말하기':'Speak','듣기':'Listen','답변 전송 →':'Send answer →','완료하고 저장':'Finish and save','다시 연습':'Practice again','상황을 선택하고 직접 영어로 대답해 봐.':'Choose a scenario and respond in English.','대화 엔진 안내:':'Conversation engine:','표현을 눌러 다양한 상황별 예문과 뉘앙스를 확인해 봐.':'Select an expression to see examples and nuances.','직접 추가':'Add manually','내 표현':'Saved','전체':'All','자주 노출':'Focus','주기적 리뷰':'Review','완전 숙지':'Mastered','다양한 상황별 예문':'Examples by situation','나의 숙련도':'My mastery','학습 설정':'Learning settings','관심 분야':'Interest topics','모든 주제':'All topics','백업 및 복원':'Backup and restore','JSON 백업':'JSON export','JSON 복원':'JSON import','모든 로컬 학습 데이터 초기화':'Reset local data','데이터는 기기의 브라우저에만 저장돼.':'Your data stays in this browser.','오늘의 상황 자동 선정':'Daily scenario selection','학습 기록':'Learning history','다른 문제':'Next question','정답 확인':'Check answer','정답 보기':'Reveal answer','영어 표현을 입력':'Enter an English expression','사용 빈도:':'Usage frequency:','숙련도는 내가 설정하며, 자동 실력 판정은 아직 제공하지 않아.':'Mastery is set manually; automatic assessment is not available yet.','무료·개인용 버전 안내':'Free personal version','퀘스트가 저장됐어!':'Quest saved!','Speaking length':'Speaking length'};
function translateUI(root){if(state.settings.language!=='en'||!root)return;let walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.parentElement?.closest('#chat,.bubble,.example,.detailtitle,textarea,option'))continue;let raw=node.nodeValue,trim=raw.trim();if(UI_EN[trim])node.nodeValue=raw.replace(trim,UI_EN[trim]);}root.querySelectorAll('[placeholder]').forEach(el=>{if(el.placeholder==='영어 표현 또는 한국어 뜻 검색')el.placeholder='Search English or Korean meaning';if(el.placeholder==='영어 표현을 입력')el.placeholder='Enter the English expression'})}
function applyLanguage(){document.documentElement.lang=state.settings.language==='en'?'en':'ko';document.querySelectorAll('.nav').forEach(n=>translateUI(n));document.querySelectorAll('.view.active').forEach(v=>translateUI(v))}

async function testEnglishNotification(){
  if(!('Notification' in window)){updatePwaStatus('이 브라우저에서는 알림을 지원하지 않아.');return;}
  if(!window.isSecureContext){updatePwaStatus('알림은 HTTPS 환경에서 테스트해 줘.');return;}
  try{
    const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
    if(permission!=='granted'){updatePwaStatus('알림이 허용되지 않았어. 브라우저 설정을 확인해 줘.');return;}
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification('English Life · Daily Quest',{body:'오늘의 미션: What would you ask if you interviewed an AI researcher?',icon:'./icon.svg',tag:'english-life-manual-test',data:{url:'./'}});
    updatePwaStatus('테스트 알림을 보냈어. 실제 매일 예약 푸시는 아직 활성화되지 않았어.');
  }catch(err){updatePwaStatus('알림 표시 실패: '+(err.message||String(err)))}
}
if('serviceWorker' in navigator&&location.protocol==='https:'){
